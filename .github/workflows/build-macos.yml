name: Build toBili macOS

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-14
            arch: arm64
          - runner: macos-15-intel
            arch: x86_64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build app, DMG and ZIP
        run: python scripts/build_macos.py
      - uses: actions/upload-artifact@v4
        with:
          name: toBili-Lite-preview-macOS-${{ matrix.arch }}
          if-no-files-found: error
          path: |
            dist/toBili-Lite-preview-macOS-${{ matrix.arch }}.dmg
            dist/toBili-Lite-preview-macOS-${{ matrix.arch }}.zip
            dist/toBili-Lite-preview-macOS-${{ matrix.arch }}-SHA256.txt
