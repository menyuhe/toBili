<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>toBili 活动资料库</title><link rel="stylesheet" href="/styles.css"></head><body><main><header class="topbar"><h1>toBili · 活动资料库</h1><button id="logout" hidden>退出登录</button></header><p class="muted">共享活动资料与各 UID 的转发关联。筛选、归档和任务保留本机。开奖结束超过 7 天的活动资料自动清理，转发关联长期保留供换机恢复。</p><p id="notice" role="status"></p><section class="card" id="login-panel"><h2>登录活动资料库</h2><form id="login-form"><label>应用账号<input id="username" required autocomplete="username"></label><label>密码<input id="password" type="password" required autocomplete="current-password"></label><button class="primary">登录</button></form></section><section id="dashboard" hidden><div class="toolbar"><input id="search" type="search" placeholder="筛选已加载活动的奖品或 ID"><button id="refresh">刷新资料</button><span id="count"></span></div><details><summary>各账号转发关联（换机记录）</summary><button id="load-reposts">读取转发记录</button><div id="reposts"></div><button id="more-reposts" hidden>加载更多转发</button></details><div id="activities" class="grid"></div><button id="more" hidden>加载更多</button></section></main><script src="/app.js"></script></body></html>
