<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 196" width="240" height="196" role="img" aria-labelledby="t d">
  <title id="t">toBili Lite</title>
  <desc id="d">粉色小电视图标，右下角带蓝色循环箭头角标</desc>

  <defs>
    <linearGradient id="pink" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FF7EA0"/>
      <stop offset="1" stop-color="#F5527C"/>
    </linearGradient>
    <linearGradient id="blue" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#35BCF2"/>
      <stop offset="1" stop-color="#0FA3E0"/>
    </linearGradient>
  </defs>

  <!-- 天线 -->
  <g stroke="url(#pink)" stroke-width="13" stroke-linecap="round">
    <line x1="66" y1="16" x2="98" y2="48"/>
    <line x1="174" y1="16" x2="142" y2="48"/>
  </g>

  <!-- 底座支脚 -->
  <g fill="url(#pink)">
    <rect x="60" y="164" width="19" height="26" rx="6"/>
    <rect x="150" y="164" width="19" height="26" rx="6"/>
  </g>

  <!-- 电视机身 -->
  <rect x="28" y="52" width="184" height="120" rx="34"
        fill="#FFFFFF" stroke="url(#pink)" stroke-width="13"/>

  <!-- 眼睛 -->
  <g fill="#2B2B2B">
    <rect x="68" y="105" width="33" height="13" rx="6.5"
          transform="rotate(-13 84.5 111.5)"/>
    <rect x="127" y="105" width="33" height="13" rx="6.5"
          transform="rotate(13 143.5 111.5)"/>
  </g>

  <!-- 循环角标：白色底环 + 蓝色圆 + 双向箭头 -->
  <circle cx="194" cy="152" r="33" fill="#FFFFFF"/>
  <circle cx="194" cy="152" r="30" fill="url(#blue)"/>

  <g fill="none" stroke="#FFFFFF" stroke-width="5" stroke-linecap="round">
    <path d="M189.55 139.78 A13 13 0 0 1 205.26 158.50"/>
    <path d="M198.45 164.22 A13 13 0 0 1 182.74 145.50"/>
  </g>
  <g fill="#FFFFFF">
    <path d="M0 -5.5 L7 0 L0 5.5 Z" transform="translate(205.26 158.50) rotate(120)"/>
    <path d="M0 -5.5 L7 0 L0 5.5 Z" transform="translate(182.74 145.50) rotate(-60)"/>
  </g>
</svg>
